name: Verify research pipeline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify contracts, evals, tests and documentation
        run: python -m brujula verify
      - name: Verify research prohibitions with executable controls
        run: node --test tests/phase*_prohibitions_*.test.cjs
      - name: Build and resolve the offline synthetic demonstration
        run: |
          python -m brujula demo --as-of 2026-09-22 --output artifacts/ci-demo
          python -m brujula report --output artifacts/ci-demo
