name: Verify research pipeline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pdf.txt
      - name: Install reviewed Ubuntu PDF native libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0
          dpkg-query -W libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0
          mkdir -p "$RUNNER_TEMP/mplconfig"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/mplconfig" >> "$GITHUB_ENV"
      - name: Install reviewed Windows PDF native asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'weasyprint-windows-onedir.zip'
          $native = Join-Path $env:RUNNER_TEMP 'weasyprint-native'
          Invoke-WebRequest -Uri 'https://github.com/Kozea/WeasyPrint/releases/download/v70.0/weasyprint-windows-onedir.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'ab1151f210b4e6bb7aa7a79e91a67e8ddb760094c107bfda55241b6aaefe7d53'
          if ($actual -ne $expected) { throw 'Reviewed WeasyPrint native asset hash differs' }
          Expand-Archive -LiteralPath $archive -DestinationPath $native
          $dll = Join-Path $native 'onedir/weasyprint/_internal'
          if (!(Test-Path -LiteralPath $dll -PathType Container)) { throw 'Native DLL directory missing' }
          $fontconfig = Join-Path $env:RUNNER_TEMP 'brujula-fontconfig.xml'
          $fonts = Join-Path $env:GITHUB_WORKSPACE 'brujula/assets/fonts'
          if (!(Test-Path -LiteralPath $fonts -PathType Container)) { throw 'Bundled font directory missing' }
          $fontCache = Join-Path $env:RUNNER_TEMP 'brujula-font-cache'
          New-Item -ItemType Directory -Path $fontCache -Force | Out-Null
          $fontDirXml = [System.Security.SecurityElement]::Escape($fonts)
          $cacheDirXml = [System.Security.SecurityElement]::Escape($fontCache)
          "<fontconfig><dir>$fontDirXml</dir><cachedir>$cacheDirXml</cachedir></fontconfig>" | Set-Content -LiteralPath $fontconfig -Encoding utf8
          $mpl = Join-Path $env:RUNNER_TEMP 'mplconfig'
          New-Item -ItemType Directory -Path $mpl -Force | Out-Null
          "WEASYPRINT_DLL_DIRECTORIES=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BRUJULA_NATIVE_SOURCE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FONTCONFIG_FILE=$fontconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MPLCONFIGDIR=$mpl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned research and PDF dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-pdf.txt
      - name: Verify contracts, evals, tests and documentation
        run: python -m brujula verify
      - name: Verify research prohibitions with executable controls
        run: |
          python -c "import glob,subprocess; files=sorted(glob.glob('tests/phase*_prohibitions*.test.cjs')); print('Collected prohibition controls:', *files, sep='\n'); assert any(f.replace(chr(92),'/') == 'tests/phase4_prohibitions.test.cjs' for f in files); subprocess.run(['node','--test',*files], check=True)"
      - name: Build and resolve the offline synthetic demonstration
        run: |
          python -m brujula demo --as-of 2026-09-22 --output artifacts/ci-demo
          python -m brujula report --output artifacts/ci-demo
      - name: Build current wheel and check installed runtime outside checkout
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP 'brujula-wheels'
          New-Item -ItemType Directory -Path $wheelDir -Force | Out-Null
          python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir $wheelDir
          if ($LASTEXITCODE -ne 0) { throw 'Current wheel build failed' }
          $wheel = Get-ChildItem -LiteralPath $wheelDir -Filter 'career_signals_mx-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) { throw 'Current wheel not found' }
          $venv = Join-Path $env:RUNNER_TEMP 'brujula-installed'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Outside-checkout virtual environment failed' }
          $installedPython = if ($env:RUNNER_OS -eq 'Windows') { Join-Path $venv 'Scripts/python.exe' } else { Join-Path $venv 'bin/python' }
          & $installedPython -m pip install --disable-pip-version-check -r (Join-Path $env:GITHUB_WORKSPACE 'requirements-pdf.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned installed dependencies failed' }
          & $installedPython -m pip install --disable-pip-version-check --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Current wheel installation failed' }
          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts/check_installed_runtime.py'
          $receipt = Join-Path $env:RUNNER_TEMP 'phase4-installed-runtime.json'
          Set-Location $env:RUNNER_TEMP
          & $installedPython $helper --checkout-root $env:GITHUB_WORKSPACE --wheel $wheel.FullName --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'Installed resource/PDF check failed' }
      - name: Retain public-safe installed runtime receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase4-installed-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/phase4-installed-runtime.json
          if-no-files-found: warn
