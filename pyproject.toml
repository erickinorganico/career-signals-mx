[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "career-signals-mx"
version = "0.1.0"
description = "Reproducible Mexican labor research pipelines and evidence-aware analytical reports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["duckdb==1.4.4", "jsonschema==4.26.0", "matplotlib==3.10.8"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
brujula = "brujula.cli:main"

[tool.setuptools]
packages = ["brujula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
